[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "global-signals-api"
version = "0.2.0"
description = "News-driven Indian-market paper trading simulator"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<26",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.9,<1",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools]
packages = ["backend"]
package-dir = { backend = "." }
include-package-data = true

[tool.setuptools.package-data]
backend = ["static/*", "migrations/*.py", "migrations/versions/*.py", "alembic.ini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
